<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>보안 아키텍처 스터디 맵 (시안) | AION Tech Blog</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style id="own">
:root{--paper:#f7f4ee;--ink:#1c1b19;--soft:#5d5a53;--rule:#d9d3c7;--accent:#8c1d18;--card:#fffdf9;--svc:#ebe5d8;--blue:#1f4e79}
@media (prefers-color-scheme:dark){:root{--paper:#14130f;--ink:#ece8df;--soft:#a39e92;--rule:#34312a;--accent:#e0675e;--card:#1b1a16;--svc:#2a2721;--blue:#7fb2e5}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink)}
body{font:400 16px/1.75 "Pretendard Variable",Pretendard,"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;word-break:keep-all;overflow-wrap:break-word;-webkit-font-smoothing:antialiased}
a{color:var(--accent)}
header.top{position:sticky;top:0;z-index:20;background:var(--paper);border-bottom:1px solid var(--rule);padding:10px 16px;display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center}
header.top h1{font-size:17px;margin:0;letter-spacing:-.01em}
header.top h1 small{font-size:11px;color:var(--accent);letter-spacing:.15em;margin-left:6px}
.modes{display:flex;gap:6px;flex-wrap:wrap}
.modes button,.rail button,.tabs button,.ctl button{font:inherit;font-size:13px;border:1px solid var(--rule);background:var(--card);color:var(--ink);border-radius:999px;padding:3px 12px;cursor:pointer}
.modes button.on,.tabs button.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.prog{margin-left:auto;font-size:12px;color:var(--soft)}
.rail{display:flex;gap:6px;overflow-x:auto;padding:10px 16px;border-bottom:1px solid var(--rule);scrollbar-width:thin}
.rail button{white-space:nowrap;border-radius:6px;padding:4px 10px;position:relative}
.rail button.on{border:2px solid var(--accent);font-weight:700}
.rail button.seen::after{content:"";position:absolute;right:3px;top:3px;width:6px;height:6px;border-radius:50%;background:var(--accent)}
.wrap{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:20px;padding:16px;max-width:1400px;margin:0 auto}
.stage{position:sticky;top:110px;align-self:start}
.stagehead small{display:block;color:var(--soft);font-size:13px}
.stagehead h2{margin:0 0 6px;font-size:21px;line-height:1.35}
.mapbox{position:relative;background:var(--card);border:1px solid var(--rule);border-radius:8px;padding:8px}
.mapbox svg.m{width:100%;height:auto;display:block}
.mapbox svg.ov{position:absolute;left:8px;top:8px;width:calc(100% - 16px);height:auto;pointer-events:none}
.ctl{display:flex;gap:6px;margin:8px 0;flex-wrap:wrap;align-items:center}
.ctl .hint{font-size:12px;color:var(--soft)}
.legend2{font-size:12.5px;color:var(--soft);line-height:1.6;margin:6px 0 0}
.panel{min-width:0}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 12px;position:sticky;top:110px;background:var(--paper);padding:4px 0;z-index:5}
.pane{animation:fadein .35s ease both}
.pane h3{font-size:16px;margin:18px 0 6px}
.pane img{max-width:100%;height:auto}
.pane figure{margin:12px 0}
.pane figcaption{font-size:12px;color:var(--soft)}
.pane table{border-collapse:collapse;font-size:13px}
.pane td,.pane th{border:1px solid var(--rule);padding:4px 6px;vertical-align:top}
.chap{font-size:15.5px}
.chap h3{border-top:1px solid var(--rule);padding-top:12px}
.eqlist{display:grid;gap:8px}
.eqcard{border:1px solid var(--rule);border-radius:6px;background:var(--card);padding:10px 12px}
.eqcard b{color:var(--accent)}
.eqcard button{margin-top:6px;font:inherit;font-size:13px;border:1px solid var(--rule);border-radius:4px;background:var(--paper);color:var(--ink);padding:2px 10px;cursor:pointer}
.eqbody{margin-top:8px;border-top:1px dashed var(--rule);padding-top:8px;font-size:14.5px;max-height:none}
.qa li{margin:6px 0}
.qa details{margin:4px 0 10px;font-size:14px;color:var(--soft)}
.note2{font-size:13px;color:var(--soft);border-left:3px solid var(--rule);padding:4px 10px;margin:10px 0}
.loading{color:var(--soft);font-size:14px;padding:20px 0}
.ev{fill:var(--blue)}.evt{fill:#fff;font:700 13px sans-serif;text-anchor:middle}
.evp{animation:evpulse 1.2s ease both}
@keyframes evpulse{0%{opacity:0;transform:scale(.3)}60%{opacity:1;transform:scale(1.25)}100%{opacity:1;transform:scale(1)}}
@keyframes fadein{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes pop{0%{opacity:.15}40%{opacity:1;stroke-width:4px}100%{opacity:1}}
@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@keyframes flow{to{stroke-dashoffset:-14}}
@keyframes bpop{0%{opacity:0}60%{opacity:1}100%{opacity:1}}
/* 애니메이션 — 단계마다 <use>를 새로 만들어 다시 돈다 */
/* <use> 안쪽에는 조상 선택자가 닿지 않으므로 클래스 하나로 걸고, 단계 값은 변수로 흘린다 */
path.ar:not(.d),path.ai,path.ag{stroke-dasharray:1;animation:draw 1.1s ease .25s both}
path.ar.d{animation:bpop .8s ease .9s both}
circle.bdr,circle.bdi,circle.bds,text.bdt{animation:bpop .6s ease .9s both}
line.lg.v4{animation:var(--flow,none)}
.s4,.s5,.s6,.s7{--flow:flow 1s linear infinite}
.s1{--pop1:pop 1s ease both}.s2{--pop2:pop 1s ease both}.s3{--pop3:pop 1s ease both}.s4{--pop4:pop 1s ease both}.s5{--pop5:pop 1s ease both}.s6{--pop6:pop 1s ease both}.s7{--pop7:pop 1s ease both}
rect.c1{animation:var(--pop1,none)}rect.c2{animation:var(--pop2,none)}rect.c3{animation:var(--pop3,none)}rect.c4{animation:var(--pop4,none)}rect.c5{animation:var(--pop5,none)}rect.c6{animation:var(--pop6,none)}rect.c7{animation:var(--pop7,none)}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.mdot{display:none}}
@media (max-width:860px){
 .wrap{grid-template-columns:1fr;padding:10px;gap:10px}
 .stage{position:sticky;top:96px;z-index:4;background:var(--paper);padding-bottom:6px}
 .mapbox{max-height:44vh;overflow:hidden}
 .stagehead h2{font-size:17px}.legend2{display:none}
 .tabs{top:calc(96px + 44vh + 70px);position:static}
 header.top h1{font-size:15px}.prog{display:none}
 .beat,.ops,.beat.b2{grid-template-columns:1fr!important}
}
</style>
</head>
<body>
<header class="top">
 <h1>보안 아키텍처 스터디 맵<small>시안</small></h1>
 <div class="modes"><button data-mode="learn" class="on">단계 학습</button><button data-mode="auto">0→7 자동 재생</button><button data-mode="sum">한눈에 정리</button><button data-mode="gl">용어집</button></div>
 <span class="prog" id="prog"></span>
</header>
<nav class="rail" id="rail" aria-label="단계"></nav>
<div class="wrap">
 <section class="stage" aria-live="polite">
  <div class="stagehead" id="stagehead"></div>
  <div class="mapbox" id="mapbox"><div class="loading">원문을 불러오는 중…</div></div>
  <div class="ctl"><button id="prev">← 이전</button><button id="replay">↻ 다시 재생</button><button id="next">다음 →</button><span class="hint">키보드 ← → · 화면을 옆으로 밀어도 넘어갑니다</span></div>
  <p class="legend2" id="legend2"></p>
 </section>
 <section class="panel">
  <div class="tabs" id="tabs"></div>
  <div id="pane" class="pane"></div>
 </section>
</div>
<script>
(function(){
'use strict';
var BASE='../';
var S={stage:0,tab:'core',mode:'learn',auto:null};
var SD=null, ID=null; // 별책·교재 문서
var EQ={'방화벽':'firewall','라우터 ACL':'firewall','VPN':'vpn','IPS':'ips','WAF':'waf','DDoS':'ddos','APT':'sandbox','NAC':'nac','DLP':'dlp','망분리':'netsep','SIEM':'siem','ESM':'siem','UEBA':'ueba','EDR':'edr','백신':'edr','IAM':'iam','XDR':'xdr-soar','SOAR':'xdr-soar'};
var TABS=[['core','핵심'],['read','흐름 해설'],['chap','교재 본문'],['event','새벽 사건'],['eq','장비'],['quiz','확인 질문']];
var seen={};try{seen=JSON.parse(localStorage.getItem('study.seen')||'{}')}catch(e){}
var $=function(s,r){return (r||document).querySelector(s)},$$=function(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s))};

function get(u){return fetch(u,{cache:'no-cache'}).then(function(r){if(!r.ok)throw new Error(u+' '+r.status);return r.text()}).then(function(t){return new DOMParser().parseFromString(t,'text/html')})}

// 별책의 지도 스타일만 가져온다(요소 선택자는 버린다)
function importCss(doc){
 var txt=$$('style',doc).map(function(s){return s.textContent}).join('\n');
 try{var sh=new CSSStyleSheet();sh.replaceSync(txt);var out=[];
  Array.prototype.forEach.call(sh.cssRules,function(r){
   if(r.type!==1)return;
   var sels=r.selectorText.split(',').map(function(x){return x.trim()});
   if(sels.every(function(x){return /^(\.|rect|text|line|circle|path)/.test(x)})&&!sels.some(function(x){return /^\.(kicker|more|dek)/.test(x)}))out.push(r.cssText);
  });
  var st=document.createElement('style');st.textContent=out.join('\n');document.head.insertBefore(st,$('#own'));
 }catch(e){console.warn(e)}
}

// 지도 심볼을 가져와 그리기용 길이·움직이는 점을 붙인다
function importMap(doc){
 var svg=$('svg[aria-hidden="true"]',doc);if(!svg)return;
 var n=0;
 $$('path.ar,path.ai,path.ag',svg).forEach(function(p){
  var d=p.classList.contains('d');
  if(!d)p.setAttribute('pathLength','1');
  if(p.classList.contains('ar')||p.classList.contains('ai')){
   var id='mp'+(n++);p.setAttribute('id',id);
   var c=doc.createElementNS('http://www.w3.org/2000/svg','circle');
   c.setAttribute('r','5');c.setAttribute('class','mdot');
   c.setAttribute('fill',p.classList.contains('ai')?'var(--ink)':'var(--accent)');
   var a=doc.createElementNS('http://www.w3.org/2000/svg','animateMotion');
   a.setAttribute('dur',d?'2.2s':'1.8s');a.setAttribute('begin','1.2s');a.setAttribute('repeatCount','indefinite');
   var mp=doc.createElementNS('http://www.w3.org/2000/svg','mpath');mp.setAttribute('href','#'+id);
   a.appendChild(mp);c.appendChild(a);p.parentNode.appendChild(c);
  }
 });
 document.body.insertBefore(document.importNode(svg,true),document.body.firstChild);
}

function fixLinks(root,base){
 $$('a[href]',root).forEach(function(a){var h=a.getAttribute('href');if(!/^(https?:|#|mailto:)/.test(h))a.setAttribute('href',base+h);a.target='_blank';});
 $$('img[src]',root).forEach(function(i){var s=i.getAttribute('src');if(!/^(https?:|data:)/.test(s))i.setAttribute('src',base+s);});
}

function sec(i){return SD.getElementById('s'+i)}

// 교재 장: h2#sN부터 다음 h2 앞까지
function chapter(i){
 var h=ID.getElementById('s'+i);if(!h)return null;
 var box=document.createElement('div');box.className='chap';
 var el=h.nextElementSibling;box.appendChild(h.cloneNode(true));
 while(el&&el.tagName!=='H2'){box.appendChild(el.cloneNode(true));el=el.nextElementSibling;}
 $$('figure.cmap,.xref,.xref1,svg[aria-hidden]',box).forEach(function(x){x.remove()});
 fixLinks(box,BASE);return box;
}
function part(box,title){ // h3 제목으로 한 토막
 var out=document.createElement('div');var on=false;
 $$(':scope > *',box).forEach(function(e){
  if(e.tagName==='H3'){on=e.textContent.indexOf(title)>=0;if(on){out.appendChild(e.cloneNode(true));return}}
  else if(e.tagName==='H2'){on=false}
  if(on)out.appendChild(e.cloneNode(true));
 });
 return out.children.length?out:null;
}

function rail(){
 var r=$('#rail');r.innerHTML='';
 for(var i=0;i<=7;i++){(function(i){
  var s=sec(i);var b=document.createElement('button');
  var t=s?$('h2',s).childNodes[1]:null;
  b.textContent=i+' · '+(t?t.textContent.replace(/\s+/g,' ').slice(0,14):'');
  b.title=s?$('h2',s).textContent:'';
  if(i===S.stage&&S.mode!=='sum'&&S.mode!=='gl')b.className='on';
  if(seen[i])b.classList.add('seen');
  b.onclick=function(){setMode('learn');go(i)};r.appendChild(b);
 })(i)}
 var n=Object.keys(seen).length;$('#prog').textContent='본 단계 '+n+'/8';
}

function drawMap(){
 var mb=$('#mapbox');var i=S.stage;
 mb.innerHTML='<svg class="m cmap s'+i+'" viewBox="0 0 720 630" role="img" aria-label="단계 '+i+' 구성도"><use href="#map"/></svg>'+
  '<svg class="ov" viewBox="0 0 720 630" aria-hidden="true" id="ov"></svg>';
 var s=sec(i);var h=$('#stagehead');
 if(s){var h2=$('h2',s).cloneNode(true);h.innerHTML='';h.appendChild(h2);var one=$('.one',s);if(one)h.appendChild(one.cloneNode(true));}
 if(S.tab==='event')eventMarks();
}

function eventMarks(){ // 새벽 사건 ①VPN ②파일 서버 ③방화벽 — 단계 2부터 교재가 그림에 표시
 var ov=$('#ov');if(!ov)return;ov.innerHTML='';
 if(S.stage<2)return;
 var pts=[[128,367,'1'],[395,327,'2'],[128,287,'3']];
 pts.forEach(function(p,k){
  var g=document.createElementNS('http://www.w3.org/2000/svg','g');
  g.setAttribute('class','evp');g.style.animationDelay=(k*0.9)+'s';g.style.transformOrigin=p[0]+'px '+p[1]+'px';
  g.innerHTML='<circle class="ev" cx="'+p[0]+'" cy="'+p[1]+'" r="11"/><text class="evt" x="'+p[0]+'" y="'+(p[1]+4.5)+'">'+p[2]+'</text>';
  ov.appendChild(g);
 });
}

function tabs(){
 var t=$('#tabs');t.innerHTML='';
 if(S.mode==='sum'||S.mode==='gl')return;
 TABS.forEach(function(x){var b=document.createElement('button');b.textContent=x[1];if(x[0]===S.tab)b.className='on';
  b.onclick=function(){S.tab=x[0];render(false)};t.appendChild(b);});
}

function pane(){
 var p=$('#pane');p.innerHTML='';p.className='';void p.offsetWidth;p.className='pane';
 var i=S.stage,s=sec(i);
 if(S.mode==='sum'){var su=SD.getElementById('sum');if(su){p.appendChild(su.cloneNode(true));}
  p.insertAdjacentHTML('beforeend','<p class="note2">각 단계를 누르면 그 단계의 지도와 설명으로 갑니다. 원문: <a href="'+BASE+'stages.html#sum" target="_blank">별책 요약표</a></p>');return}
 if(S.mode==='gl'){var gl=SD.getElementById('gl');if(gl)p.appendChild(gl.cloneNode(true));return}
 if(!s){p.textContent='원문을 찾지 못했습니다.';return}
 if(S.tab==='core'){
  ['.arch','.arch2','.beat','.ops'].forEach(function(c){$$(c,s).forEach(function(e){p.appendChild(e.cloneNode(true))})});
  p.insertAdjacentHTML('beforeend','<p class="note2">지도: 빨간 선은 공격·문제의 경로, 검은 선은 솔루션·사람의 동작, 회색 점선은 로그가 보안관제로 모이는 길입니다. 움직이는 점의 개수와 속도는 로그의 양을 뜻하지 않습니다. 원문: <a target="_blank" href="'+BASE+'stages.html#s'+i+'">별책 단계 '+i+'</a></p>');
 }
 if(S.tab==='read'){var r=$('.read',s);if(r)p.appendChild(r.cloneNode(true));else p.textContent='이 단계에는 흐름 해설이 없습니다.'}
 if(S.tab==='chap'){var c=chapter(i);if(c)p.appendChild(c);else p.textContent='교재 장을 찾지 못했습니다.'}
 if(S.tab==='event'){
  var c2=chapter(i),ev=c2?part(c2,'한 회사로 따라가기'):null;
  var intro=$$('p',ID).filter(function(x){return x.textContent.indexOf('같은 회사에서 일어난 사건도 하나 따라갑니다')>=0})[0];
  if(intro){var ip=intro.cloneNode(true);fixLinks(ip,BASE);p.appendChild(ip)}
  if(i>=2)p.insertAdjacentHTML('beforeend','<p class="note2">지도의 파란 ①②③은 사건의 순서입니다. ① VPN 접속 → ② 파일 서버 로그인 → ③ 방화벽에 남은 바깥 전송 기록. 교재는 회사가 바깥에서 들어오는 길을 연 2장부터 이 순서를 그림에 표시합니다.</p>');
  if(ev)p.appendChild(ev);else if(i>0)p.insertAdjacentHTML('beforeend','<p class="note2">이 장에는 「한 회사로 따라가기」가 없습니다.</p>');
 }
 if(S.tab==='eq'){
  var list=document.createElement('div');list.className='eqlist';
  $$('.dev p',s).forEach(function(d){
   var name=$('b',d)?$('b',d).textContent:'';var slug=null;
   Object.keys(EQ).forEach(function(k){if(!slug&&name.indexOf(k)>=0)slug=EQ[k]});
   var card=document.createElement('div');card.className='eqcard';card.appendChild(d.cloneNode(true));
   if(slug){var b=document.createElement('button');b.textContent='장비 편에서 자세히 ▾';var body=null;
    b.onclick=function(){if(body){body.remove();body=null;b.textContent='장비 편에서 자세히 ▾';return}
     body=document.createElement('div');body.className='eqbody';body.textContent='불러오는 중…';card.appendChild(body);b.textContent='접기 ▴';
     get(BASE+'eq/'+slug+'.html').then(function(doc){var m=$('main',doc)||$('article',doc)||doc.body;var c=m.cloneNode(true);
      $$('script,nav,header,footer',c).forEach(function(x){x.remove()});fixLinks(c,BASE+'eq/');body.innerHTML='';body.appendChild(c);
      body.insertAdjacentHTML('beforeend','<p class="note2">원문: <a target="_blank" href="'+BASE+'eq/'+slug+'.html">장비 편 '+slug+'</a></p>')})
     .catch(function(){body.innerHTML='<a target="_blank" href="'+BASE+'eq/'+slug+'.html">장비 편 열기</a>'});};
    card.appendChild(b);}
   list.appendChild(card);
  });
  if(!list.children.length)p.textContent='이 단계에 새로 들어온 장비가 없습니다.';else p.appendChild(list);
 }
 if(S.tab==='quiz'){
  var c3=chapter(i),q=c3?part(c3,'확인 질문'):null;
  if(q){q.className='qa';$$('li',q).forEach(function(li){var d=document.createElement('details');d.innerHTML='<summary>생각해 본 뒤 펼치기</summary>답은 「교재 본문」 탭에서 이 질문의 낱말이 나오는 문단을 찾아보십시오. (모범 답안은 다음 판에 검증을 거쳐 붙입니다.)';li.appendChild(d)});p.appendChild(q)}
  else p.textContent='이 단계에는 확인 질문이 없습니다.';
 }
}

function render(redraw){
 if(redraw!==false)drawMap();else if(S.tab==='event')eventMarks();else{var ov=$('#ov');if(ov)ov.innerHTML=''}
 rail();tabs();pane();
 $('.stage').style.display=(S.mode==='sum'||S.mode==='gl')?'none':'';
 if(S.mode!=='sum'&&S.mode!=='gl'){seen[S.stage]=1;try{localStorage.setItem('study.seen',JSON.stringify(seen))}catch(e){}
  if(location.hash!=='#s'+S.stage)history.replaceState(null,'','#s'+S.stage);}
}
function go(i){S.stage=Math.max(0,Math.min(7,i));render(true);var b=$$('#rail button')[S.stage];if(b)b.scrollIntoView({block:'nearest',inline:'center'});}
function setMode(m){
 if(S.auto){clearInterval(S.auto);S.auto=null}
 S.mode=m;$$('.modes button').forEach(function(b){b.classList.toggle('on',b.dataset.mode===m)});
 if(m==='auto'){S.tab='core';go(0);S.auto=setInterval(function(){if(S.stage>=7){setMode('learn');return}go(S.stage+1)},7000);return}
 render(m==='learn');
 if(m==='sum'){$$('#pane table tr',document).forEach(function(tr,k){if(k>0){tr.style.cursor='pointer';tr.onclick=function(){var t=tr.cells[0].textContent;var n=parseInt(t,10);if(t.indexOf('0~3')===0)n=0;setMode('learn');go(n)}}})}
}

$$('.modes button').forEach(function(b){b.onclick=function(){setMode(b.dataset.mode)}});
$('#prev').onclick=function(){setMode('learn');go(S.stage-1)};
$('#next').onclick=function(){setMode('learn');go(S.stage+1)};
$('#replay').onclick=function(){render(true)};
document.addEventListener('keydown',function(e){if(e.target.tagName==='INPUT')return;if(e.key==='ArrowRight'){setMode('learn');go(S.stage+1)}if(e.key==='ArrowLeft'){setMode('learn');go(S.stage-1)}});
var tx=null;$('#mapbox').addEventListener('touchstart',function(e){tx=e.touches[0].clientX},{passive:true});
$('#mapbox').addEventListener('touchend',function(e){if(tx===null)return;var dx=e.changedTouches[0].clientX-tx;tx=null;if(Math.abs(dx)>50){setMode('learn');go(S.stage+(dx<0?1:-1))}});

Promise.all([get(BASE+'stages.html'),get(BASE+'index.html')]).then(function(r){
 SD=r[0];ID=r[1];importCss(SD);importMap(SD);
 var lg=$('.legend',SD);if(lg)$('#legend2').innerHTML=lg.innerHTML;
 var m=/^#s([0-7])$/.exec(location.hash);if(m)S.stage=+m[1];
 render(true);
}).catch(function(e){$('#mapbox').innerHTML='<p class="loading">원문을 불러오지 못했습니다: '+e.message+' — <a href="'+BASE+'stages.html">별책</a>·<a href="'+BASE+'index.html">교재</a>를 직접 여십시오.</p>'});
})();
</script>
</body>
</html>
